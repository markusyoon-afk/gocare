<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F4FBFB" />
    <title>GoCARE for iPhone</title>
    <script>
      /* Apply the theme before first paint (no flash). Order: ?theme= URL param
         (shareable deep-link, persisted so the in-app toggle stays in sync) →
         saved preference → light default. */
      (function () {
        try {
          var q = (location.search.match(/[?&]theme=(dark|light)/i) || [])[1];
          if (q) q = q.toLowerCase();
          var t = q || localStorage.getItem("gocare-theme") || "light";
          if (q) {
            try {
              localStorage.setItem("gocare-theme", q);
            } catch (e) {}
          }
          document.documentElement.setAttribute("data-theme", t);
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", t === "dark" ? "#0A2A33" : "#F4FBFB");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GoCARE" />
